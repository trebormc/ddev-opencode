name: ddev-opencode

ddev_version_constraint: '>= v1.24.10'

dependencies:
  - trebormc/ddev-ai-ssh
  - trebormc/ddev-playwright-mcp
  - trebormc/ddev-beads
  - trebormc/ddev-agents-sync

pre_install_actions:
  - |
    #ddev-description:Checking prerequisites for OpenCode
    echo "Installing ddev-opencode add-on..."
  - |
    #ddev-description:Creating shared OpenCode config directory
    OC_DIR="${HOME}/.ddev/opencode"
    mkdir -p "$OC_DIR/config" "$OC_DIR/config/node_modules"
    # Migrate credentials from old auth/ directory if needed
    if [ -f "$OC_DIR/auth/auth.json" ] && [ ! -s "$OC_DIR/auth.json" ]; then
      cp "$OC_DIR/auth/auth.json" "$OC_DIR/auth.json"
      echo "Migrated credentials from auth/ directory to auth.json"
    fi
    # If a previous failed bind-mount created auth.json as a directory, remove it
    if [ -d "$OC_DIR/auth.json" ]; then
      rmdir "$OC_DIR/auth.json" 2>/dev/null || rm -rf "$OC_DIR/auth.json"
      echo "Removed invalid auth.json directory (was created by a previous failed bind-mount)"
    fi
    # Create valid empty JSON auth.json if missing or empty (OpenCode parses it as JSON)
    if [ ! -s "$OC_DIR/auth.json" ]; then
      printf '{}\n' > "$OC_DIR/auth.json"
    fi

project_files:
  - docker-compose.opencode.yaml
  - opencode-build/Dockerfile.opencode
  - opencode-build/entrypoint.sh
  - opencode-build/ssh-config
  - opencode-build/opencode.default.json
  - opencode-build/opencode-notifier.default.json
  - commands/host/opencode
  - commands/host/oc
  - .env.multica.example

global_files: []

post_install_actions:
  - |
    #ddev-description:Configuring OpenCode environment
    if [ ! -f .env.opencode ]; then
      cat > .env.opencode << 'ENVEOF'
    # OpenCode environment configuration

    # Shared OpenCode directory for credentials and config.
    # This directory is shared across ALL DDEV projects so you only
    # need to configure once. Change only if you need a custom location.
    # Files: auth.json (credentials), config/ (optional shared opencode.json,
    # opencode-notifier.json, AGENTS.md overrides + node_modules plugin cache)
    HOST_OPENCODE_DIR=${HOME}/.ddev/opencode

    # Timezone
    TZ=UTC
    ENVEOF
      echo "Created .env.opencode — review settings in .ddev/.env.opencode"
    else
      echo ".env.opencode already exists, skipping"
    fi
    # NOTE: opencode.json and opencode-notifier.json are NOT seeded here.
    # The entrypoint builds the container-global config by DEEP-MERGING a
    # cascade (higher levels win key by key):
    #   1. project root opencode.json        — merged on top natively by OpenCode
    #   2. ~/.ddev/opencode/config/*.json    — user's config shared across all DDEV projects
    #   3. agents volume (ddev-agents-sync)  — defaults synced from the agents repo
    #   4. baked into the image              — basic defaults (works without agents-sync)
    echo "OpenCode add-on installed successfully!"
  - |
    #ddev-description:Preparing Multica integration (optional, shared across AI addons)
    # Multica config lives in ~/.ddev/multica/ — a neutral directory shared
    # by every Multica-aware DDEV addon (this one, ddev-claude-code, etc.) so
    # one configuration enables the daemon in all of them.
    MULTICA_DIR="${HOME}/.ddev/multica"
    mkdir -p "$MULTICA_DIR"
    # Always refresh the template (this is just the example, never user data).
    if [ -f .env.multica.example ]; then
      cp .env.multica.example "$MULTICA_DIR/.env.multica.example"
    fi
    # Create empty .env.multica only if missing. Docker needs the file to
    # exist before mounting; otherwise it would create a directory.
    # Don't overwrite — another Multica-aware addon may have created it first
    # and the user may have already added their token.
    MULTICA_ENV="$MULTICA_DIR/.env.multica"
    if [ ! -f "$MULTICA_ENV" ]; then
      : > "$MULTICA_ENV"
    fi
    # Detect per-project override (.ddev/.env.multica) — takes precedence over global.
    PROJECT_MULTICA_ENV=".env.multica"
    if [ -s "$PROJECT_MULTICA_ENV" ] && grep -q '^[[:space:]]*MULTICA_TOKEN=[^[:space:]]\+' "$PROJECT_MULTICA_ENV" 2>/dev/null; then
      echo "Multica: per-project token detected in .ddev/.env.multica — daemon will use project config."
    elif grep -q '^[[:space:]]*MULTICA_TOKEN=[^[:space:]]\+' "$MULTICA_ENV" 2>/dev/null; then
      echo "Multica: global token detected in $MULTICA_ENV — daemon will start on next ddev restart."
    else
      echo "Multica: no MULTICA_TOKEN configured — daemon disabled."
      echo "         Global  : cp $MULTICA_DIR/.env.multica.example $MULTICA_ENV  (shared by all projects)"
      echo "         Per-proj: cp .ddev/.env.multica.example .ddev/.env.multica   (this project only, overrides global)"
    fi

removal_actions:
  - |
    #ddev-description:Cleaning up OpenCode
    echo "OpenCode add-on removed."
